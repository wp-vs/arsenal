<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Worst Game In The World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    gap: 30px;
    padding: 40px 20px;
  }

  h1 {
    font-size: 1.6rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #888;
  }

  #utc-clock {
    font-size: 1.3rem;
    color: #aaa;
    letter-spacing: 2px;
  }

  #name-input {
    padding: 10px 16px;
    font-size: 1.1rem;
    font-family: inherit;
    background: #2a2a2a;
    border: 2px solid #444;
    color: #e0e0e0;
    border-radius: 4px;
    text-align: center;
    width: 260px;
  }

  #name-input:focus {
    outline: none;
    border-color: #888;
  }

  #the-button {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 35%, #ff4444, #aa0000);
    box-shadow: 0 8px 24px rgba(200, 0, 0, 0.5), inset 0 -4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
  }

  #the-button:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 10px 30px rgba(200, 0, 0, 0.7), inset 0 -4px 8px rgba(0,0,0,0.3);
  }

  #the-button:active:not(:disabled) {
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(200, 0, 0, 0.4), inset 0 4px 8px rgba(0,0,0,0.4);
  }

  #the-button:disabled {
    background: radial-gradient(circle at 35% 35%, #664444, #442222);
    box-shadow: 0 4px 12px rgba(100, 0, 0, 0.3), inset 0 -4px 8px rgba(0,0,0,0.3);
    cursor: not-allowed;
    color: #886666;
  }

  #message {
    min-height: 60px;
    text-align: center;
    font-size: 1.1rem;
    line-height: 1.6;
    max-width: 400px;
  }

  #message .score-value {
    font-size: 2rem;
    font-weight: bold;
    color: #ff6666;
    display: block;
    margin-top: 6px;
  }

  #message .new-high {
    color: #ffcc00;
    font-weight: bold;
  }

  #status-msg {
    font-size: 0.9rem;
    color: #666;
    min-height: 1.2em;
  }

  h2 {
    font-size: 1.1rem;
    color: #888;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 10px;
  }

  table {
    border-collapse: collapse;
    min-width: 460px;
  }

  th, td {
    padding: 8px 14px;
    text-align: left;
    border-bottom: 1px solid #333;
  }

  th {
    color: #888;
    font-weight: normal;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }

  td {
    font-size: 0.95rem;
  }

  td.score-col {
    text-align: right;
    color: #ff6666;
    font-weight: bold;
  }

  td.time-col {
    color: #777;
    font-size: 0.85rem;
  }

  #no-scores {
    color: #555;
    font-style: italic;
    font-size: 0.9rem;
  }

  @media (max-width: 520px) {
    table { min-width: unset; width: 100%; }
    th, td { padding: 6px 8px; font-size: 0.82rem; }
  }
</style>
</head>
<body>

<h1>The Worst Game In The World</h1>
<div id="utc-clock"></div>

<input type="text" id="name-input" placeholder="Enter your name" maxlength="30" autocomplete="off">

<button id="the-button">Press Me</button>

<div id="status-msg"></div>
<div id="message"></div>

<h2>High Scores</h2>
<table id="high-score-table">
  <thead>
    <tr><th>#</th><th>Name</th><th>Score</th><th>Last Pressed (UTC)</th></tr>
  </thead>
  <tbody id="high-score-body"></tbody>
</table>
<div id="no-scores">No scores yet. Be the first.</div>

<script>
(function () {
  const STORAGE_KEY = 'worst_game_data';
  // Tracks which names THIS device has already used
  const STORAGE_DEVICE = 'worst_game_device_used';

  const nameInput = document.getElementById('name-input');
  const button = document.getElementById('the-button');
  const messageEl = document.getElementById('message');
  const statusEl = document.getElementById('status-msg');
  const clockEl = document.getElementById('utc-clock');
  const scoreBody = document.getElementById('high-score-body');
  const noScoresEl = document.getElementById('no-scores');

  // --- UTC clock ---
  function updateClock() {
    const now = new Date();
    clockEl.textContent = now.toISOString().replace('T', '  ').replace(/\.\d+Z$/, ' UTC');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- Lognormal distribution ---
  function lognormalSample(mean, std) {
    const variance = std * std;
    const sigma2 = Math.log(1 + variance / (mean * mean));
    const mu = Math.log(mean) - sigma2 / 2;
    const sigma = Math.sqrt(sigma2);
    const u1 = Math.random();
    const u2 = Math.random();
    const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    return Math.exp(mu + sigma * z);
  }

  // --- Storage helpers ---
  // Game data: { [nameLower]: { name, score, lastPressed } }
  function getData() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // Device tracking: Set of lowercase names this device has pressed for
  function getDeviceUsed() {
    try { return JSON.parse(localStorage.getItem(STORAGE_DEVICE)) || []; }
    catch { return []; }
  }
  function markDeviceUsed(key) {
    const used = getDeviceUsed();
    if (!used.includes(key)) {
      used.push(key);
      localStorage.setItem(STORAGE_DEVICE, JSON.stringify(used));
    }
  }
  function hasDeviceUsed(key) {
    return getDeviceUsed().includes(key);
  }

  // --- Render high score table ---
  function renderScores() {
    const data = getData();
    const sorted = Object.values(data)
      .sort((a, b) => b.score - a.score);

    scoreBody.innerHTML = '';
    noScoresEl.style.display = sorted.length ? 'none' : 'block';

    sorted.forEach(function (entry, i) {
      const tr = document.createElement('tr');
      const pressedDate = new Date(entry.lastPressed);
      const timeStr = pressedDate.toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
      tr.innerHTML =
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(entry.name) + '</td>' +
        '<td class="score-col">' + entry.score.toFixed(2) + '</td>' +
        '<td class="time-col">' + timeStr + '</td>';
      scoreBody.appendChild(tr);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Update button state based on current name ---
  function updateButtonState() {
    const name = nameInput.value.trim().toLowerCase();
    if (!name) {
      statusEl.textContent = '';
      button.disabled = false;
      return;
    }
    if (hasDeviceUsed(name)) {
      button.disabled = true;
      statusEl.textContent = '"' + nameInput.value.trim() + '" has already pressed the button on this device.';
    } else {
      button.disabled = false;
      statusEl.textContent = '';
    }
  }

  // --- Button click ---
  button.addEventListener('click', function () {
    const name = nameInput.value.trim();
    if (!name) {
      messageEl.innerHTML = 'Please enter your name first.';
      return;
    }

    const key = name.toLowerCase();

    if (hasDeviceUsed(key)) {
      updateButtonState();
      messageEl.innerHTML = 'You already pressed the button as <b>' + escapeHtml(name) + '</b> on this device.';
      return;
    }

    // Generate score
    const score = lognormalSample(100, 50);
    const now = Date.now();

    // Mark this name as used on this device
    markDeviceUsed(key);

    // Update game data (keep highest score)
    const data = getData();
    const existing = data[key];
    const isNewHigh = !existing || score > existing.score;

    if (isNewHigh) {
      data[key] = { name: name, score: score, lastPressed: now };
    } else {
      data[key].lastPressed = now;
    }
    saveData(data);

    // Display result
    let html = escapeHtml(name) + ' scored:<span class="score-value">' + score.toFixed(2) + '</span>';
    if (isNewHigh) {
      html += '<span class="new-high">New personal best!</span>';
    }
    messageEl.innerHTML = html;

    renderScores();
    updateButtonState();
  });

  nameInput.addEventListener('input', function () {
    messageEl.innerHTML = '';
    updateButtonState();
  });

  // --- Init ---
  renderScores();
  updateButtonState();
})();
</script>

</body>
</html>
